spring.application.name=vinilove
server.port=8080

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/vinilove?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Usuarios
springdoc.swagger-ui.urls[0].url=/v3/api-docs/usuarios
springdoc.swagger-ui.urls[1].name=Catalogo
springdoc.swagger-ui.urls[1].url=/v3/api-docs/catalogo
springdoc.swagger-ui.urls[2].name=Carrito
springdoc.swagger-ui.urls[2].url=/v3/api-docs/carrito
springdoc.swagger-ui.urls[3].name=Pedidos, blog y contacto
springdoc.swagger-ui.urls[3].url=/v3/api-docs
vinilove.jwt.public-key=${JWT_PUBLIC_KEY:file:/run/secrets/jwt-public.pem}
