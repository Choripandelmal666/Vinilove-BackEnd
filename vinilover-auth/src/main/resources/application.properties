spring.application.name=vinilover-auth
server.port=8080
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:vinilove_auth}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
vinilove.jwt.private-key=${JWT_PRIVATE_KEY:file:/run/secrets/jwt-private.pem}
vinilove.jwt.public-key=${JWT_PUBLIC_KEY:file:/run/secrets/jwt-public.pem}
vinilove.auth.admin.email=${ADMIN_EMAIL:}
vinilove.auth.admin.password=${ADMIN_INITIAL_PASSWORD:}
vinilove.auth.admin.run=${ADMIN_RUN:ADMIN0001}
