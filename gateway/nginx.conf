server {
    listen 80;
    server_name _;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /api/usuarios {
        proxy_pass http://auth-service:8080;
    }
    location ^~ /api/usuarios/ {
        proxy_pass http://auth-service:8080;
    }
    location ^~ /api/vendedores/ {
        proxy_pass http://auth-service:8080;
    }
    location ^~ /api/productos/ {
        proxy_pass http://catalog-service:8080;
    }
    location = /api/productos {
        proxy_pass http://catalog-service:8080;
    }
    location ^~ /api/ofertas {
        proxy_pass http://catalog-service:8080;
    }
    location ^~ /api/carrito/ {
        proxy_pass http://cart-service:8080;
    }
    location ^~ /api/pedidos {
        proxy_pass http://legacy-service:8080;
    }
    location ^~ /api/contacto {
        proxy_pass http://legacy-service:8080;
    }
    location ^~ /api/blog {
        proxy_pass http://legacy-service:8080;
    }
    location = /swagger-ui.html {
        proxy_pass http://legacy-service:8080;
    }
    location ^~ /swagger-ui/ {
        proxy_pass http://legacy-service:8080;
    }
    location ^~ /v3/api-docs {
        proxy_pass http://legacy-service:8080;
    }
    location ^~ /api/health {
        proxy_pass http://legacy-service:8080;
    }
    location / {
        return 404;
    }
}
